services:
  # ==========================================================
  # 1. Database Service: PostgreSQL 16
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: xgame_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-xgame_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xgame_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-xgame_db}
    ports:
      - "${DB_PORT_BIND:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-xgame_admin} -d ${DB_NAME:-xgame_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - xgame_network

  # ==========================================================
  # 2. Backend Service: Node.js Express REST API + DUPR Engine
  # ==========================================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: xgame_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-xgame_admin}
      DB_PASSWORD: ${DB_PASSWORD:-xgame_secure_pass_2026}
      DB_NAME: ${DB_NAME:-xgame_db}
      JWT_SECRET: ${JWT_SECRET:-xgame_pickleball_jwt_secret_2026}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-631151864886-epbhvap7g8gpjc5ob0uc7b4qcl6mkd09.apps.googleusercontent.com}
    ports:
      - "${BACKEND_PORT_BIND:-5088}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xgame_network

  # ==========================================================
  # 3. Frontend Service: Nginx Reverse Proxy + React SPA
  # ==========================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-631151864886-epbhvap7g8gpjc5ob0uc7b4qcl6mkd09.apps.googleusercontent.com}
    container_name: xgame_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT_BIND:-3088}:80"
    depends_on:
      - backend
    networks:
      - xgame_network

volumes:
  postgres_data:
    driver: local

networks:
  xgame_network:
    driver: bridge
